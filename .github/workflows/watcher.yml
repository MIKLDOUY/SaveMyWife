name: TNBC Clinical Watcher

on:
  schedule:
    - cron: "0 0 */5 * *"   # tous les 5 jours à minuit UTC
  workflow_dispatch:        # pour lancer manuellement si besoin

jobs:
  run-watcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run watcher script
        run: |
          python watcher.py

      - name: Commit results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git commit -m "Update results.json (auto watcher)" || echo "No changes to commit"
          git push

