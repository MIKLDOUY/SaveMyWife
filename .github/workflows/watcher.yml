name: TNBC Clinical Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  run-watcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run watcher
        run: |
          python watcher.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add results.json results.txt results.csv summary_for_oncologist.md alerts.log || true
          git commit -m "Update watcher results" || echo "No changes to commit"

      - name: Fetch remote main
        run: |
          git fetch origin main

      - name: Rebase on remote main safe
        run: |
          git rebase origin/main || (git rebase --abort && echo "Rebase failed; aborting push" && exit 0)

      - name: Push results force-safe
        run: |
          git push --force-with-lease origin HEAD:main
